; ============================================================
; IoT PoC - Firmware ESP32
; Framework: Arduino-ESP32 (ben duoi la ESP-IDF + FreeRTOS)
;
; Board: ESP32 classic DevKit (ESP32-D0WD, cau USB-UART CH340, flash 4MB)
; Giao thuc: API.md muc 2 (MQTT Payload) o thu muc goc cua repo
; ============================================================
[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 460800              ; CH340 hay loi o 921600

; default.csv: nvs 20K | otadata 8K | app0 1.25MB | app1 1.25MB | spiffs 1.375MB
; Firmware nay khong co OTA nen chi dung app0, nhung giu bang phan vung goc
; de khong phai xoa sach flash khi nap len board da co san du lieu NVS.
board_build.partitions = default.csv

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4      ; encode/decode JSON
    knolleary/PubSubClient @ ^2.8       ; MQTT client (dong bo, chay trong task_net)

build_flags =
    ; 1 = chi in loi cua Arduino/IDF, de log cua app (app_log.cpp) de doc.
    ; Can soi sau vao WiFi/TCP thi tam nang len 4 roi build lai.
    -DCORE_DEBUG_LEVEL=1
    -DMQTT_MAX_PACKET_SIZE=1024         ; mac dinh PubSubClient chi 256 byte -> khong du
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=1
    -DFW_VERSION=\"1.0.0\"

; Cau hinh WiFi/Broker KHONG de o day (tranh commit nham mat khau).
; Copy include/secrets.example.h -> include/secrets.h roi sua.
